[build-system]
requires = ["setuptools>=68.0.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["theseus"]

[project]
name = "theseus"
version = "2.0.0"
description = "A modular PyTorch Lightning framework for deep learning research and production training"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["pytorch", "lightning", "template", "deep learning", "machine learning"]
authors = [
  {name = "Minh-Khoi Pham", email = "minhkhoi.pham@adaptcentre.ie" },
  {name = "Hoang-Lan Nguyen", email = "nhlan091000@gmail.com"}
]
maintainers = [
  {name = "Minh-Khoi Pham", email = "minhkhoi.pham@adaptcentre.ie" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "webcolors>=1.13",
    "wandb>=0.17.0",
    "tensorboard>=2.16.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "gdown>=5.1.0",
    "tabulate>=0.9.0",
    "loguru>=0.7.0",
    "kaleido>=0.2.1",
    "optuna>=3.6.0",
    "deepdiff>=7.0.0",
    "hydra-core>=1.3.2",
    "lightning>=2.4.0",
    "huggingface-hub>=0.23.0",
    "safetensors>=0.4.0",
    "torchvision>=0.24.1",
    "scikit-learn>=1.7.2",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-order>=1.2.0",
    "pre-commit>=3.6.0",
    "ruff>=0.5.0",
]
cv = [
    "albumentations>=1.4.0",
    "omegaconf>=2.3.0",
]
cv_classification = [
    "timm>=1.0.0",
    "scikit-plot",
    "grad-cam>=1.5.0",
]
cv_semantic = [
    "segmentation-models-pytorch>=0.3.3",
]
cv_detection = [
    "ensemble_boxes>=1.0.9",
    "pycocotools>=2.0.7",
]
nlp = [
    "pyvi>=0.1.1",
    "py_vncorenlp>=0.1.3",
    "spacy>=3.7.0",
    "transformers>=4.40.0",
    "nltk>=3.8.0",
    "captum>=0.7.0",
]
nlp_retrieval = [
    "sentence_transformers>=3.0.0",
    "rank_bm25>=0.2.2",
    "elasticsearch>=8.12.0",
]
ml = [
    "pandas>=2.1.0",
    "pandarallel>=1.6.5",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "optuna>=3.6.0",
    "psycopg2-binary>=2.9.9",
    "gunicorn>=21.2.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "shap>=0.45.0",
    "lime>=0.2.0.1",
    "scikit-plot",
]
all = [
    "theseus[cv,cv_classification,cv_semantic,cv_detection,nlp,nlp_retrieval,ml]",
]

[project.urls]
"Homepage" = "https://github.com/kaylode/theseus"
"Repository" = "https://github.com/kaylode/theseus"
"Issues" = "https://github.com/kaylode/theseus/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B905", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["theseus"]
