name: ci_segmentation
on:
  pull_request:
    branches:
      - master
      - dev
  push:
    branches:
      - master
      - 'V**'
      - dev

env:
  GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
  REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test-segmentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: iterative/setup-cml@v3

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-segm-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-segm-

      - name: Install dependencies
        run: |
          uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -e '.[dev,cv,cv_semantic]'
          uv pip install --system dvc dvc-gdrive
          npm install -g markdown-table-cli

      - name: Download data
        run: |
          echo "$GDRIVE_CREDENTIALS_DATA" > credentials.json
          dvc remote modify gdrive --local gdrive_user_credentials_file ./credentials.json
          dvc pull
          ls -la samples

      - name: Test with pytest
        run: |
          uv run pytest tests/semantic --capture=no

      - name: Display report
        run: |
          echo "# Semantic Report" > report.md
          echo "#### Metrics" >> report.md
          cat runs/pytest_segm/Validation/metrics.json | md-table >> report.md
          echo >> report.md
          echo "#### Prediction" >> report.md
          echo "![Prediction](runs/pytest_segm/overlays/fc9399fafb30_01.jpg)" >> report.md
          echo "![Prediction](runs/pytest_segm/overlays/fcac2903b622_06.jpg)" >> report.md
          echo "![Prediction](runs/pytest_segm/overlays/fcac2903b622_11.jpg)" >> report.md
          cml comment create report.md
